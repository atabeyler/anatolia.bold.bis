services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anatolia
      POSTGRES_PASSWORD: anatolia
      POSTGRES_DB: anatolia_bis
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anatolia"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single service: serves both the API and the built frontend from one
  # process/port, matching the single-service Render deploy (render.yaml).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://anatolia:anatolia@postgres:5432/anatolia_bis
      RUST_LOG: info
      JWT_SECRET: local-compose-access-secret
      JWT_REFRESH_SECRET: local-compose-refresh-secret
      ADMIN_SEED_TOKEN: local-compose-seed-token
      ADMIN_USER_CODE: ADMIN01
      ADMIN_PASSWORD: ChangeMe1!
      ADMIN_EMAIL: info@boldkimya.com.tr
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
