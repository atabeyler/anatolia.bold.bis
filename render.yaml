# No `databases:` block: this account's free plan allows only one active
# free-tier Postgres, already in use by another project. anatolia-bis
# instead points DATABASE_URL (set in the Render dashboard, not committed
# here) at that existing instance — the backend creates and uses its own
# `anatolia_bis` schema there (see server/src/db.rs), so its tables never
# collide with the other project's.

services:
  # Single service, one URL: the Rust binary serves both the API (under
  # /api/*) and the built frontend (everything else, with an SPA fallback
  # to index.html) from the same process — no separate static-site
  # resource, so the deployed URL never has "api" or "web" in it.
  - type: web
    name: anatolia-bis
    env: rust
    plan: free
    branch: main
    autoDeployTrigger: commit
    # Builds the frontend first (its output is embedded into the service
    # at STATIC_DIR below), then the backend binary.
    buildCommand: cd client && npm install && npm run build && cd ../server && cargo build --release
    startCommand: ./server/target/release/anatolia-bis-server
    healthCheckPath: /api/health
    envVars:
      # Set in the Render dashboard: the existing Postgres instance's
      # "Internal Database URL" (from that database's own Render page).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Signs the registration approve/reject email links only — kept
      # separate from the two secrets above so compromising one token type
      # never compromises the others (see docs/SECURITY_ARCHITECTURE.md).
      - key: APPROVAL_TOKEN_SECRET
        generateValue: true
      # Signs the short-lived login-time MFA challenge token — separate
      # from the access/refresh secrets above so a compromised MFA
      # challenge token can never be replayed as a real session token.
      # Required in production once TOTP MFA is enabled — see
      # server/src/mfa.rs, docs/ENVIRONMENT.md.
      - key: MFA_TOKEN_SECRET
        generateValue: true
      # AES-256-GCM key encrypting national ID numbers at rest — see
      # server/src/national_id.rs, docs/ENVIRONMENT.md. Required in
      # production, and must be exactly 64 hex characters (32 bytes) —
      # `generateValue` is deliberately not used here since its output
      # isn't guaranteed to be valid hex, which would just trade this
      # startup panic for a different one. Set once in the Render
      # dashboard with the output of `openssl rand -hex 32`. Rotating
      # this key makes every existing encrypted national ID undecryptable.
      - key: NATIONAL_ID_ENCRYPTION_KEY
        sync: false
      # BiometricProvider is mock-only until a real, server-side face
      # provider ships (see docs/ROADMAP.md Phase 4). Production refuses to
      # start with the mock provider unless this is explicitly set — set
      # here, deliberately, as a conscious acknowledgment that this
      # deployment does not yet perform real face comparison. Flip this
      # entry to sync: false (unset) once a real provider is configured, so
      # a future accidental redeploy without one fails loudly instead of
      # silently serving mock "matches".
      - key: ALLOW_MOCK_BIOMETRICS
        value: "true"
      # Set in the Render dashboard (not this blueprint) once, then used to
      # seed the first SYSTEM_ADMIN via POST /api/v1/admin/seed-admin.
      - key: ADMIN_SEED_TOKEN
        generateValue: true
      - key: ADMIN_USER_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Frontend is served from this same service now, so no separate
      # origin needs to be allow-listed for the web app itself; leave
      # unset unless/until a mobile or desktop client needs cross-origin
      # API access.
      - key: ALLOWED_ORIGINS
        sync: false
      # Where the built frontend lives relative to this service's working
      # directory (repository root on Render, since rootDir is unset
      # above) — see server/src/main.rs.
      - key: STATIC_DIR
        value: client/dist
      # Falls back to RENDER_EXTERNAL_URL (this service's own URL) if
      # unset, which is now always correct since there's only one URL.
      - key: APP_URL
        sync: false
      # Optional: registration/approval emails are silently skipped if unset.
      - key: RESEND_API_KEY
        sync: false
      - key: RUST_LOG
        value: info
