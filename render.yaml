# No `databases:` block: this account's free plan allows only one active
# free-tier Postgres, already in use by another project. anatolia-bis-api
# instead points DATABASE_URL (set in the Render dashboard, not committed
# here) at that existing instance — the backend creates and uses its own
# `anatolia_bis` schema there (see server/src/db.rs), so its tables never
# collide with the other project's.

services:
  # Backend: native Rust binary, no Docker layer. See docs/DEPLOYMENT.md.
  - type: web
    name: anatolia-bis-api
    env: rust
    plan: free
    branch: main
    rootDir: server
    autoDeployTrigger: commit
    buildCommand: cargo build --release
    startCommand: ./target/release/anatolia-bis-server
    healthCheckPath: /api/health
    # Changes that only touch the frontend or docs never affect this
    # service's build output — skip the (expensive) Rust release compile
    # for those pushes.
    buildFilter:
      ignoredPaths:
        - "client/**"
        - "*.md"
        - "docs/**"
        - ".github/**"
    envVars:
      # Set in the Render dashboard: the existing Postgres instance's
      # "Internal Database URL" (from that database's own Render page).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set in the Render dashboard (not this blueprint) once, then used to
      # seed the first SYSTEM_ADMIN via POST /api/v1/admin/seed-admin.
      - key: ADMIN_SEED_TOKEN
        generateValue: true
      - key: ADMIN_USER_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # The deployed frontend's origin — set once the static site below
      # has its own Render URL (or a custom domain).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # Optional: registration/approval emails are silently skipped if unset.
      - key: RESEND_API_KEY
        sync: false
      - key: RUST_LOG
        value: info

  # Frontend: static build, served from Render's CDN — no server process.
  - type: web
    name: anatolia-bis-web
    env: static
    branch: main
    rootDir: client
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      ignoredPaths:
        - "server/**"
        - "*.md"
        - "docs/**"
        - ".github/**"
    envVars:
      # The backend service's own Render URL + /api, once known.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Client-side routing: any unmatched path falls back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
