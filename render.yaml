# No `databases:` block: this account's free plan allows only one active
# free-tier Postgres, already in use by another project. anatolia-bis
# instead points DATABASE_URL (set in the Render dashboard, not committed
# here) at that existing instance — the backend creates and uses its own
# `anatolia_bis` schema there (see server/src/db.rs), so its tables never
# collide with the other project's.

services:
  # Single service, one URL: the Rust binary serves both the API (under
  # /api/*) and the built frontend (everything else, with an SPA fallback
  # to index.html) from the same process — no separate static-site
  # resource, so the deployed URL never has "api" or "web" in it.
  - type: web
    name: anatolia-bis
    env: rust
    plan: free
    branch: main
    autoDeployTrigger: commit
    # Builds the frontend first (its output is embedded into the service
    # at STATIC_DIR below), then the backend binary.
    buildCommand: cd client && npm install && npm run build && cd ../server && cargo build --release
    startCommand: ./server/target/release/anatolia-bis-server
    healthCheckPath: /api/health
    envVars:
      # Set in the Render dashboard: the existing Postgres instance's
      # "Internal Database URL" (from that database's own Render page).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Signs the registration approve/reject email links only — kept
      # separate from the two secrets above so compromising one token type
      # never compromises the others (see docs/SECURITY_ARCHITECTURE.md).
      - key: APPROVAL_TOKEN_SECRET
        generateValue: true
      # Signs the short-lived login-time MFA challenge token — separate
      # from the access/refresh secrets above so a compromised MFA
      # challenge token can never be replayed as a real session token.
      # Required in production once TOTP MFA is enabled — see
      # server/src/mfa.rs, docs/ENVIRONMENT.md.
      - key: MFA_TOKEN_SECRET
        generateValue: true
      # AES-256-GCM key encrypting national ID numbers at rest — see
      # server/src/national_id.rs, docs/ENVIRONMENT.md. Required in
      # production, and must be exactly 64 hex characters (32 bytes) —
      # `generateValue` is deliberately not used here since its output
      # isn't guaranteed to be valid hex, which would just trade this
      # startup panic for a different one. Set once in the Render
      # dashboard with the output of `openssl rand -hex 32`. Rotating
      # this key makes every existing encrypted national ID undecryptable.
      - key: NATIONAL_ID_ENCRYPTION_KEY
        sync: false
      # A real, server-side face provider exists (BIOMETRIC_PROVIDER=onnx)
      # but this deployment does not run it —
      # this native Rust buildpack service builds without the
      # onnx-provider Cargo feature (see server/Cargo.toml), and switching
      # BIOMETRIC_PROVIDER here alone would just panic at startup rather
      # than silently do anything, per config.rs's hard-panic guard.
      # Enabling the real provider on Render requires moving this service
      # to a Docker-based deploy on a new-enough glibc image first (see
      # docs/ENVIRONMENT.md and the Dockerfile's onnx-provider build arg) —
      # a deliberate, separately verified infrastructure change, not a
      # one-line flip of this file. Until that happens, this service
      # intentionally runs the mock provider in production, which requires
      # this explicit acknowledgment (BIOMETRIC_PROVIDER defaults to
      # "mock", and production refuses to start under it without
      # ALLOW_MOCK_BIOMETRICS=true — see server/src/config.rs). Flip this
      # entry to sync: false (unset) once the Docker migration lands and
      # BIOMETRIC_PROVIDER=onnx is set instead, so a future accidental
      # redeploy without either fails loudly instead of silently serving
      # mock "matches".
      - key: ALLOW_MOCK_BIOMETRICS
        value: "true"
      # Left unset deliberately: BIOMETRIC_PROVIDER defaults to "mock" (see
      # above). Set to "onnx" only after this service has migrated to the
      # Docker-based deploy described above — setting it here first would
      # be a hard startup panic (server/src/db/mod.rs), not a silent
      # no-op, since this buildpack build never includes the ONNX runtime.
      - key: BIOMETRIC_PROVIDER
        sync: false
      # Set in the Render dashboard (not this blueprint) once, then used to
      # seed the first SYSTEM_ADMIN via POST /api/v1/admin/seed-admin.
      - key: ADMIN_SEED_TOKEN
        generateValue: true
      - key: ADMIN_USER_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Frontend is served from this same service now, so no separate
      # origin needs to be allow-listed for the web app itself; leave
      # unset unless/until a mobile or desktop client needs cross-origin
      # API access.
      - key: ALLOWED_ORIGINS
        sync: false
      # Where the built frontend lives relative to this service's working
      # directory (repository root on Render, since rootDir is unset
      # above) — see server/src/main.rs.
      - key: STATIC_DIR
        value: client/dist
      # Falls back to RENDER_EXTERNAL_URL (this service's own URL) if
      # unset, which is now always correct since there's only one URL.
      - key: APP_URL
        sync: false
      # Optional: registration/approval emails are silently skipped if unset.
      - key: RESEND_API_KEY
        sync: false
      # Optional real OSINT providers — see server/src/osint/mod.rs's
      # from_env for the exact precedence. Each slot falls back to its
      # mock implementation when no key for it is set; leaving all four
      # unset (the default) reproduces today's mock-only behavior.
      #
      # Web search: TAVILY_API_KEY is checked first (see
      # server/src/osint/tavily.rs — its free tier needs no payment
      # method), then BRAVE_SEARCH_API_KEY (server/src/osint/websearch.rs).
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      # News: CURRENTS_API_KEY is checked first (see
      # server/src/osint/currents.rs — NewsAPI's free tier forbids
      # production use), then NEWS_API_KEY (server/src/osint/news.rs).
      - key: CURRENTS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: RUST_LOG
        value: info
      # Defaults to disabled (see server/src/main.rs) since a background
      # self-callback is surprising behavior most deployments shouldn't get
      # for free. This service runs on the free plan, which spins down
      # after ~15 minutes idle, so it opts in explicitly here to avoid the
      # resulting cold-start latency.
      - key: ENABLE_SELF_PING
        value: "true"
