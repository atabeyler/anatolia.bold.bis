# No `databases:` block: this account's free plan allows only one active
# free-tier Postgres, already in use by another project. anatolia-bis
# instead points DATABASE_URL (set in the Render dashboard, not committed
# here) at that existing instance — the backend creates and uses its own
# `anatolia_bis` schema there (see server/src/db.rs), so its tables never
# collide with the other project's.

services:
  # Single service, one URL: the Rust binary serves both the API (under
  # /api/*) and the built frontend (everything else, with an SPA fallback
  # to index.html) from the same process — no separate static-site
  # resource, so the deployed URL never has "api" or "web" in it.
  - type: web
    name: anatolia-bis
    env: rust
    plan: free
    branch: main
    autoDeployTrigger: commit
    # Builds the frontend first (its output is embedded into the service
    # at STATIC_DIR below), then the backend binary.
    buildCommand: cd client && npm install && npm run build && cd ../server && cargo build --release
    startCommand: ./server/target/release/anatolia-bis-server
    healthCheckPath: /api/health
    envVars:
      # Set in the Render dashboard: the existing Postgres instance's
      # "Internal Database URL" (from that database's own Render page).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set in the Render dashboard (not this blueprint) once, then used to
      # seed the first SYSTEM_ADMIN via POST /api/v1/admin/seed-admin.
      - key: ADMIN_SEED_TOKEN
        generateValue: true
      - key: ADMIN_USER_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Frontend is served from this same service now, so no separate
      # origin needs to be allow-listed for the web app itself; leave
      # unset unless/until a mobile or desktop client needs cross-origin
      # API access.
      - key: ALLOWED_ORIGINS
        sync: false
      # Where the built frontend lives relative to this service's working
      # directory (repository root on Render, since rootDir is unset
      # above) — see server/src/main.rs.
      - key: STATIC_DIR
        value: client/dist
      # Falls back to RENDER_EXTERNAL_URL (this service's own URL) if
      # unset, which is now always correct since there's only one URL.
      - key: APP_URL
        sync: false
      # Optional: registration/approval emails are silently skipped if unset.
      - key: RESEND_API_KEY
        sync: false
      - key: RUST_LOG
        value: info
