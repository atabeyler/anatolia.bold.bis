# No `databases:` block: this account's free plan allows only one active
# free-tier Postgres, already in use by another project. anatolia-bis
# instead points DATABASE_URL (set in the Render dashboard, not committed
# here) at that existing instance — the backend creates and uses its own
# `anatolia_bis` schema there (see server/src/db.rs), so its tables never
# collide with the other project's.

services:
  - type: web
    name: anatolia-bis
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: ONNX_PROVIDER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APPROVAL_TOKEN_SECRET
        generateValue: true
      - key: MFA_TOKEN_SECRET
        generateValue: true
      - key: NATIONAL_ID_ENCRYPTION_KEY
        sync: false
      - key: ALLOW_MOCK_BIOMETRICS
        sync: false
      - key: BIOMETRIC_PROVIDER
        value: onnx
      - key: ADMIN_SEED_TOKEN
        generateValue: true
      - key: ADMIN_USER_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: STATIC_DIR
        value: client/dist
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # One completed face search can fan out to every configured external
      # source class. Reverse-image sources receive only the sanitized probe;
      # text sources receive permitted candidate/public-page context.
      - key: AUTO_OSINT_AFTER_BIOMETRIC_SEARCH
        value: "true"
      - key: OSINT_AUTO_MAX_CANDIDATES
        value: "5"

      # Text web sources. If both keys are configured, both providers run.
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false

      # News/publication sources. If both keys are configured, both run.
      - key: CURRENTS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

      # Reverse-image/public-web sources. Every configured source receives
      # the same sanitized probe and reports its own evidence independently.
      - key: TINEYE_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: YANDEX_SEARCH_API_KEY
        sync: false
      - key: YANDEX_SEARCH_FOLDER_ID
        sync: false

      - key: RUST_LOG
        value: info
      - key: ENABLE_SELF_PING
        value: "true"
