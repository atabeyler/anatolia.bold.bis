[package]
name = "anatolia-bis-server"
version = "0.2.2"
edition = "2021"
publish = false

[lib]
name = "anatolia_bis_server"
path = "src/lib.rs"

[[bin]]
name = "anatolia-bis-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }
bcrypt = "0.15"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
hex = "0.4"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
aes-gcm = "0.11.0"
base64 = "0.23.1"
hmac = "0.13.0"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "ndarray", "std", "tls-rustls"] }
ndarray = "0.17.2"
async-trait = "0.1.92"
strsim = "0.11.1"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
opt-level = 2
strip = true
